<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Migits - Season 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #00BFFF; --yellow: #FFD700; --pink: #FF69B4; --dark-text: #2c2c2c;
            --paper-bg: #fcf9f2; --tape: rgba(255, 255, 255, 0.7); --margin-red: #ff9999;
        }
        body {
            font-family: 'Patrick Hand', cursive, sans-serif;
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(#e5e5e5 1px, transparent 1px),
                linear-gradient(90deg, #e5e5e5 1px, transparent 1px),
                radial-gradient(circle at 30px 30px, #ddd 5px, transparent 6px),
                radial-gradient(circle at 30px 100px, #ddd 5px, transparent 6px),
                radial-gradient(circle at 30px 170px, #ddd 5px, transparent 6px);
            background-size: 20px 20px, 20px 20px, 100% 140px, 100% 140px, 100% 140px;
            color: var(--dark-text); margin: 0; padding: 0;
            border-left: 60px solid var(--margin-red);
        }
        
        /* --- FIX FOUC --- */
        nav a, #season-title, .episode-card {
            opacity: 0;
            visibility: hidden;
        }

        nav {
            display: flex; justify-content: center; gap: 20px; padding: 25px 20px; flex-wrap: wrap;
            position: sticky; top: 0; z-index: 100; background-color: var(--paper-bg); 
            border-bottom: 3px dashed var(--dark-text);
        }
        nav a {
            text-decoration: none; color: var(--dark-text); font-family: 'Caveat', cursive; font-size: 1.8rem;
            font-weight: bold; background-color: var(--yellow); padding: 12px 25px; 
            box-shadow: 4px 4px 0px var(--dark-text); border: 3px solid var(--dark-text); 
            transition: transform 0.2s; transform: rotate(-1deg);
        }
        nav a:nth-child(even) { transform: rotate(2deg); background-color: var(--blue); }
        nav a:hover { transform: scale(1.15) rotate(0deg); background-color: var(--pink); color: white; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        h2 {
            font-family: 'Caveat', cursive; font-size: 3rem; color: var(--blue); text-align: center; margin-bottom: 30px;
            background: white; display: inline-block; padding: 10px 30px; box-shadow: 3px 3px 0px var(--dark-text);
            border: 2px solid var(--dark-text); transform: rotate(-1deg); clip-path: polygon(0% 0%, 100% 0%, 98% 100%, 2% 100%);
        }

        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 20px; }
        
        .episode-card {
            background: white; padding: 15px; box-shadow: 5px 5px 15px rgba(0,0,0,0.15); border: 2px solid var(--dark-text);
            position: relative; transition: transform 0.3s; transform: rotate(1deg); display: flex; flex-direction: column;
        }
        .episode-card.even { transform: rotate(-2deg); }
        .episode-card::before {
            content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-2deg);
            width: 80px; height: 25px; background-color: var(--tape); border: 1px solid rgba(0,0,0,0.1); box-shadow: 0px 2px 4px rgba(0,0,0,0.1); z-index: 2;
        }
        .episode-card img { width: 100%; height: 200px; object-fit: cover; background-color: #eee; border: 2px solid var(--dark-text); margin-bottom: 10px; }
        .episode-info h3 { margin: 0 0 10px 0; font-family: 'Caveat', cursive; font-size: 1.8rem; color: var(--pink); }
        .episode-info p { margin: 0 0 15px 0; font-size: 1.2rem; color: #555; flex-grow: 1; }
        
        .watch-btn {
            display: block; text-align: center; font-family: 'Caveat', cursive; font-size: 1.5rem;
            background-color: var(--yellow); color: var(--dark-text); text-decoration: none; padding: 8px;
            border: 2px solid var(--dark-text); box-shadow: 3px 3px 0px var(--dark-text); transition: all 0.2s;
        }
        .watch-btn:hover { background-color: var(--pink); color: white; transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--dark-text); }
        
        footer {
            text-align: center; padding: 30px; background-color: var(--yellow); border-top: 3px dashed var(--dark-text);
            font-family: 'Caveat', cursive; font-size: 1.5rem; color: var(--dark-text); margin-top: 50px;
        }
        footer p { margin: 5px 0; }
        .paw-print { font-size: 1.2rem; color: var(--pink); }
    </style>
</head>
<body>
    <nav>
        <a href="../">Home</a>
        <a href="#">Season 1</a>
        <!-- <a href="season-2/index.html">Season 2</a>
        <a href="season-3/index.html">Season 3</a>
        <a href="season-4/index.html">Season 4</a> -->
    </nav>
    <div class="container">
        <div style="text-align: center;">
            <h2 id="season-title">Season 1</h2>
        </div>
        <div class="episode-grid">
            <!-- EPISODE 1 -->
            <div class="episode-card">
                <img src="https://via.placeholder.com/300x200/00BFFF/FFFFFF?text=Episode+1" alt="Episode 1">
                <div class="episode-info">
                    <h3>Ep 1: The Migits</h3>
                    <p>The origin story! A chaotic tug-of-war creates the band.</p>
                    <a href="season-1/ep-1.html" class="watch-btn">▶ Watch Now</a>
                </div>
            </div>
            <!-- EPISODE 2 PLACEHOLDER -->
            <div class="episode-card even">
                <img src="https://via.placeholder.com/300x200/FFD700/000000?text=Episode+2" alt="Episode 2">
                <div class="episode-info">
                    <h3>Ep 2: Coming Soon</h3>
                    <p>Max gets curious about a giant speaker...</p>
                    <a href="#" class="watch-btn">▶ Watch Now</a>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 The Migits. Made by Max, Sam, Hux, and Har.</p>
        <p class="paw-print">🐾 Nacho was here 🐾</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            const tl = gsap.timeline({ defaults: { ease: "back.out(1.5)" } });
            
            tl.fromTo("nav a", 
                { y: -100, autoAlpha: 0 }, 
                { duration: 0.6, y: 0, autoAlpha: 1, stagger: 0.1 }
            )
            .fromTo("#season-title", 
                { scale: 0, rotation: -20, autoAlpha: 0 }, 
                { duration: 0.8, scale: 1, rotation: -1, autoAlpha: 1 }, "-=0.3"
            )
            .fromTo(".episode-card", 
                { y: 80, autoAlpha: 0 }, 
                { duration: 0.8, y: 0, autoAlpha: 1, stagger: 0.3, ease: "elastic.out(1, 0.5)" }, "-=0.2");
        });
    </script>
</body>
</html>
