<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Migits - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        /* --- ALL DESIGN IS IN HERE --- */
        :root {
            --blue: #00BFFF;
            --yellow: #FFD700;
            --pink: #FF69B4;
            --dark-text: #2c2c2c;
            --paper-bg: #fcf9f2;
            --tape: rgba(255, 255, 255, 0.6);
            --margin-red: #ff9999;
        }
        body {
            font-family: 'Patrick Hand', cursive, sans-serif;
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(#e5e5e5 1px, transparent 1px),
                linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--dark-text);
            margin: 0;
            padding: 0;
            border-left: 60px solid var(--margin-red);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--paper-bg);
            border-bottom: 3px dashed var(--dark-text);
        }
        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: var(--yellow);
            padding: 10px 20px;
            box-shadow: 3px 3px 0px var(--dark-text);
            border: 2px solid var(--dark-text);
            transition: transform 0.2s;
            transform: rotate(-1deg);
        }
        nav a:nth-child(even) { transform: rotate(2deg); background-color: var(--blue); }
        nav a:hover { transform: scale(1.1) rotate(0deg); background-color: var(--pink); color: white; }
        header { text-align: center; padding: 40px 20px; position: relative; }
        header img {
            max-width: 450px;
            width: 100%;
            border: 5px solid white;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            transform: rotate(-1deg);
            background: white;
            padding: 10px;
        }
        header p { font-size: 1.5rem; color: var(--pink); font-family: 'Caveat', cursive; text-shadow: 1px 1px 0px var(--dark-text); }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h2 {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            color: var(--blue);
            text-align: center;
            margin-bottom: 30px;
            background: white;
            display: inline-block;
            padding: 10px 30px;
            box-shadow: 3px 3px 0px var(--dark-text);
            border: 2px solid var(--dark-text);
            transform: rotate(-1deg);
            clip-path: polygon(0% 0%, 100% 0%, 98% 100%, 2% 100%);
        }
        .video-wrapper {
            background: white;
            padding: 20px;
            border: 3px solid var(--dark-text);
            box-shadow: 8px 8px 0px var(--blue);
            position: relative;
            margin-bottom: 40px;
            transform: rotate(0.5deg);
        }
        .video-wrapper::before, .video-wrapper::after {
            content: ''; position: absolute; width: 100px; height: 30px; background-color: var(--tape); border: 1px solid rgba(0,0,0,0.1); box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }
        .video-wrapper::before { top: -15px; left: -30px; transform: rotate(-45deg); }
        .video-wrapper::after { bottom: -15px; right: -30px; transform: rotate(-45deg); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border: 2px solid var(--dark-text); background-color: black; }
        .video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        footer {
            text-align: center;
            padding: 30px;
            background-color: var(--yellow);
            border-top: 3px dashed var(--dark-text);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--dark-text);
            margin-top: 50px;
        }
        footer p { margin: 5px 0; }
        .paw-print { font-size: 1.2rem; color: var(--pink); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="season1.html">Season 1</a>
        <a href="season2.html">Season 2</a>
        <a href="season3.html">Season 3</a>
        <a href="season4.html">Season 4</a>
    </nav>
    <header>
        <img src="migits-logo.jpg" alt="The Migits Logo">
        <p>The greatest low-poly band in the world!</p>
    </header>
    <div class="container">
        <div style="text-align: center;">
            <h2>🌟 Latest Episode 🌟</h2>
        </div>
        <div class="video-wrapper">
            <div class="video-container">
                <video controls>
                    <source src="episode1.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
        <div style="text-align: center; font-size: 1.5rem;">
            <h3 style="font-family: 'Caveat', cursive; color: var(--pink); margin: 0;">Episode 1: The Migits</h3>
            <p>Watch how Max, Penny, Petunia, Pansy, and Nacho first met and formed the band!</p>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 The Migits. Made by Max, Sam, Hux, and Har.</p>
        <p class="paw-print">🐾 Nacho was here 🐾</p>
    </footer>
</body>
</html>
