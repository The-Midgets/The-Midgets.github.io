<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Migits - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #00BFFF; --yellow: #FFD700; --pink: #FF69B4; --dark-text: #2c2c2c;
            --paper-bg: #fcf9f2; --tape: rgba(255, 255, 255, 0.7); --margin-red: #ff9999;
        }
        body {
            font-family: 'Patrick Hand', cursive, sans-serif;
            background-color: var(--paper-bg);
            /* Notebook lines + binder holes */
            background-image: 
                linear-gradient(#e5e5e5 1px, transparent 1px),
                linear-gradient(90deg, #e5e5e5 1px, transparent 1px),
                radial-gradient(circle at 30px 30px, #ddd 5px, transparent 6px),
                radial-gradient(circle at 30px 100px, #ddd 5px, transparent 6px),
                radial-gradient(circle at 30px 170px, #ddd 5px, transparent 6px);
            background-size: 20px 20px, 20px 20px, 100% 140px, 100% 140px, 100% 140px;
            color: var(--dark-text); margin: 0; padding: 0;
            border-left: 60px solid var(--margin-red);
        }

        /* --- FIX FOUC (Changed .button-group to .btn) --- */
        nav a, .error-card, .error-card h1, .error-card p, .btn {
            opacity: 0;
            visibility: hidden;
        }

        nav {
            display: flex; justify-content: center; gap: 20px; padding: 25px 20px; flex-wrap: wrap;
            position: sticky; top: 0; z-index: 100; background-color: var(--paper-bg); 
            border-bottom: 3px dashed var(--dark-text);
        }
        nav a {
            text-decoration: none; color: var(--dark-text); font-family: 'Caveat', cursive; font-size: 1.8rem;
            font-weight: bold; background-color: var(--yellow); padding: 12px 25px; 
            box-shadow: 4px 4px 0px var(--dark-text); border: 3px solid var(--dark-text); 
            transition: transform 0.2s; transform: rotate(-1deg);
        }
        nav a:nth-child(even) { transform: rotate(2deg); background-color: var(--blue); }
        nav a:hover { transform: scale(1.15) rotate(0deg); background-color: var(--pink); color: white; }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 20px;
        }

        /* The Missing Poster */
        .error-card {
            background: white;
            padding: 40px 30px;
            border: 3px solid var(--dark-text);
            box-shadow: 8px 8px 0px var(--blue);
            position: relative;
            max-width: 650px;
            width: 100%;
            text-align: center;
            transform: rotate(-1.5deg);
        }

        /* Masking tape effect */
        .error-card::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-2deg);
            width: 120px; height: 35px; background-color: var(--tape); border: 1px solid rgba(0,0,0,0.1); 
            box-shadow: 0px 2px 4px rgba(0,0,0,0.1); z-index: 2;
        }

        .error-card h1 {
            font-family: 'Caveat', cursive;
            font-size: 6rem;
            color: var(--pink);
            margin: 0;
            line-height: 1;
            text-shadow: 3px 3px 0px var(--yellow);
        }

        .error-card h2 {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: var(--blue);
            margin: 10px 0 20px 0;
        }

        .error-card p {
            font-size: 1.4rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: var(--dark-text);
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            background-color: var(--yellow);
            padding: 10px 25px;
            border: 3px solid var(--dark-text);
            box-shadow: 4px 4px 0px var(--dark-text);
            transition: transform 0.2s;
            transform: rotate(1deg);
        }

        .btn:hover {
            transform: scale(1.1) rotate(0deg);
            background-color: var(--blue);
            color: white;
        }

        .btn.pink {
            background-color: var(--pink);
            color: white;
        }

        .btn.pink:hover {
            background-color: var(--yellow);
            color: var(--dark-text);
        }

        footer {
            text-align: center; padding: 30px; background-color: var(--yellow); border-top: 3px dashed var(--dark-text);
            font-family: 'Caveat', cursive; font-size: 1.5rem; color: var(--dark-text); margin-top: 50px;
        }
        footer p { margin: 5px 0; }
        .paw-print { font-size: 1.2rem; color: var(--pink); }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="season-1/">Season 1</a>
        <a href="/about/">About</a>
        <!-- <a href="season-2/index.html">Season 2</a>
        <a href="season-3/index.html">Season 3</a>
        <a href="season-4/index.html">Season 4</a> -->
    </nav>
    <div class="container">
        <div class="error-card">
            <h1>404</h1>
            <h2>Page Not Found!</h2>
            <p>Max got curious and hit the funny piano key. The page went <strong>BOING!</strong> right out of the browser. Don't worry, Pansy is trying to find the right note to bring it back.</p>
            <div class="button-group">
                <a href="/" class="btn">Home</a>
                <a href="season-1/" class="btn pink">See Season 1</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 The Migits. All rights reserved.</p>
        <p class="paw-print">🐾 Nacho was here 🐾</p>
    </footer>

    <!-- GSAP LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            const tl = gsap.timeline({ defaults: { ease: "back.out(1.7)" } });
            
            // 1. Nav pops in
            tl.fromTo("nav a", 
                { y: -100, autoAlpha: 0 }, 
                { duration: 0.6, y: 0, autoAlpha: 1, stagger: 0.1 }
            )
            // 2. The missing poster drops in with a wiggle
            .fromTo(".error-card", 
                { y: -150, rotation: -10, autoAlpha: 0 }, 
                { duration: 1.2, y: 0, rotation: -1.5, autoAlpha: 1, ease: "elastic.out(1, 0.5)" }, "-=0.3"
            )
            // 3. The 404 text squashes and stretches
            .fromTo(".error-card h1", 
                { scale: 0, autoAlpha: 0 }, 
                { duration: 0.8, scale: 1, autoAlpha: 1, ease: "bounce.out" }, "-=0.6"
            )
            // 4. The message fades up
            .fromTo(".error-card p", 
                { y: 20, autoAlpha: 0 }, 
                { duration: 0.6, y: 0, autoAlpha: 1 }, "-=0.4"
            )
            // 5. The buttons pop in one by one
            .fromTo(".btn", 
                { scale: 0, autoAlpha: 0 }, 
                { duration: 0.6, scale: 1, autoAlpha: 1, stagger: 0.15, ease: "back.out(2)" }, "-=0.2"
            );
        });
    </script>
</body>
</html>
